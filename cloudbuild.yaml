steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/workers/rating-monitoring:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/workers/rating-monitoring:$COMMIT_SHA

  # Переключаем Cloud Run Job на только что собранный образ.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_JOB}
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/workers/rating-monitoring:$COMMIT_SHA

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/workers/rating-monitoring:$COMMIT_SHA

substitutions:
  _REGION: europe-west3
  _JOB: rating-monitoring

options:
  logging: CLOUD_LOGGING_ONLY
